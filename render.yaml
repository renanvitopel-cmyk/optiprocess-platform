services:
  - type: web
    name: optiprocess-platform
    runtime: node
    plan: free
    region: oregon
    # --include=dev e obrigatorio: NODE_ENV=production (abaixo) faz o npm pular as
    # devDependencies, e o build precisa delas (typescript, @types/*, vite, prisma).
    # Em runtime apenas as dependencies sao usadas.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: PUBLIC_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: INITIAL_ADMIN_NAME
        value: Administrador OptiProcess
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
